name: oregonetservice
description: "Oregonet Service - WebView wrapper app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  webview_flutter_wkwebview: ^3.16.0
  file_picker: ^13.1.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# --- Konfigurasi app icon, digenerate dari assets/images/logo.png ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  # Kalau logonya kotak dengan sudut lancip dan mau dipotong bulat/rounded
  # otomatis oleh Android, aktifkan baris berikut:
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/images/logo.png"

# --- Konfigurasi splash screen, digenerate dari assets/images/logo.png ---
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
